name: vulncheck

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "34 5 * * 6"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run vulnerability check
        run: go tool govulncheck ./...
