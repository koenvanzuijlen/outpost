name: Vulncheck

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "34 5 * * 6"

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        id: mise
        with:
          install_args: go
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-vulncheck-${{ steps.mise.outputs.go }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-vulncheck-
      - name: Check for known vulnerabilities with govulncheck
        run: go tool govulncheck ./...
