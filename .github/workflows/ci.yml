name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: sqlc generated
        run: go tool sqlc diff
      - name: templ generated
        run: |
          go tool templ generate
          test -z "$(git status --porcelain)"
      - name: templ formatting
        run: go tool templ fmt -fail .
      - name: Template formatting
        # Version should match mise.toml
        run: pipx run djlint==1.47.1 --check internal/server/templates
      - name: Lint
        run: go tool golangci-lint run
      - name: Tests
        run: go test -race ./...

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Migrations on main are append-only
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- internal/database/migrations/)
          if [ -n "$changed" ]; then
            echo "::error::Migrations on main must not change. Add a new migration instead (mise run migrate-new <name>)."
            echo "$changed"
            exit 1
          fi
