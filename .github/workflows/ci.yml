name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        id: mise
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-check-${{ steps.mise.outputs.go }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-check-
      - name: Install Node dependencies with npm
        run: npm ci
      - name: Check generated Go code with sqlc
        run: go tool sqlc diff
      - name: Check generated Go code with templ
        run: |
          go tool templ generate
          test -z "$(git status --porcelain)"
      - name: Check formatting with templ
        run: go tool templ fmt -fail -prettier-required .
      - name: Check formatting with Prettier
        run: mise run fmt-check
      - name: Run linters with golangci-lint
        run: go tool golangci-lint run
      - name: Run all tests with the race detector
        run: go test -race ./...

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that existing migrations do not change
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- internal/database/migrations/)
          if [ -n "$changed" ]; then
            echo "::error::Migrations on main must not change. Add a new migration instead (mise run migrate-new <name>)."
            echo "$changed"
            exit 1
          fi
