name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test -race ./...
      - name: Lint
        run: go tool golangci-lint run
      - name: sqlc Diff
        run: go tool sqlc diff
