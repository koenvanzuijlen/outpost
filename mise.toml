[tools]
go = "1.27.3"
"pipx:djlint" = "1.47.1"

[env]
_.file = ".env"

[tasks.build]
description = "Build the binary"
run = "go build -o outpost ./cmd/outpost"

[tasks.start]
description = "Run the server"
run = "go run ./cmd/outpost"

[tasks.start-fresh]
description = "Delete database & run the server"
run = ['rm -f "${DATABASE_PATH:-outpost.db}"*', "go run ./cmd/outpost"]

[tasks.test]
description = "Run all tests"
run = "go test -race ./..."

[tasks.setup]
description = "Build local dev tool binaries into .tools/"
run = [
	"go build -o .tools/golangci-lint-v2 github.com/golangci/golangci-lint/v2/cmd/golangci-lint",
	'ln -sf "$(mise which djlint)" .tools/djlint',
]

[tasks.lint]
description = "Run linters"
run = "go tool golangci-lint run"

[tasks.tmpl-fmt]
description = "Format templates"
run = "djlint --reformat internal/server/templates"

[tasks.tmpl-check]
description = "Check template formatting"
run = "djlint internal/server/templates --check"

[tasks.vulncheck]
description = "Run vulnerability checks"
run = "go tool govulncheck ./..."

[tasks.gen-sql]
description = "Regenerate sqlc code"
run = "go tool sqlc generate"

[tasks.migrate-status]
description = "Show migration status"
run = 'go tool goose -dir internal/database/migrations sqlite3 "${DATABASE_PATH:-outpost.db}" status'

[tasks.migrate-down]
description = "Roll back the last migration"
run = 'go tool goose -dir internal/database/migrations sqlite3 "${DATABASE_PATH:-outpost.db}" down'

[tasks.migrate-new]
description = "Create a new migration"
run = 'go tool goose -dir internal/database/migrations -s create {{arg(name="name")}} sql'
