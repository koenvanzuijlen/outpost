[tools]
go = "1.27.3"
node = "26.13.0"

[env]
_.file = ".env"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.build]
description = "Build the binary"
run = "go build -o outpost ./cmd/outpost"

[tasks.start]
description = "Run the server"
run = "go run ./cmd/outpost"

[tasks.start-fresh]
description = "Delete the database and run the server"
run = ['rm -f "${DATABASE_PATH:-outpost.db}"*', "go run ./cmd/outpost"]

[tasks.test]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.setup]
description = "Install Node dependencies and build local dev tool binaries into .tools/"
run = [
	"npm ci",
	"go build -o .tools/golangci-lint-v2 github.com/golangci/golangci-lint/v2/cmd/golangci-lint",
	"go build -o .tools/templ github.com/a-h/templ/cmd/templ",
]

[tasks.fmt]
description = "Format files with Prettier"
run = "prettier --write ."

[tasks.fmt-check]
description = "Check formatting with Prettier"
run = "prettier --check ."

[tasks.lint]
description = "Run linters with golangci-lint"
run = "go tool golangci-lint run"

[tasks.gen-templ]
description = "Generate Go code from templ files with templ"
run = "go tool templ generate"

[tasks.templ-fmt]
description = "Format templ files with templ"
run = "go tool templ fmt -prettier-required ."

[tasks.vulncheck]
description = "Check for known vulnerabilities with govulncheck"
run = "go tool govulncheck ./..."

[tasks.gen-sql]
description = "Generate Go code from SQL queries with sqlc"
run = "go tool sqlc generate"

[tasks.migrate-status]
description = "Show the migration status with goose"
run = 'go tool goose -dir internal/database/migrations sqlite3 "${DATABASE_PATH:-outpost.db}" status'

[tasks.migrate-down]
description = "Roll back the last migration with goose"
run = 'go tool goose -dir internal/database/migrations sqlite3 "${DATABASE_PATH:-outpost.db}" down'

[tasks.migrate-new]
description = "Create a new migration with goose"
run = 'go tool goose -dir internal/database/migrations -s create {{arg(name="name")}} sql'
