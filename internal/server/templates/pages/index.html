{{define "content"}}
  <h1>Outpost</h1>
  {{template "searchForm" ""}}
  <div>
    <ul>
      {{range .Items}}
        <li>{{.Game.Title}}{{if .Game.ReleasedAt}} ({{.Game.ReleasedAt.Year}}){{end}} - {{.Platform.Name}}{{with .UserGame.Status}} - {{.}}{{end}}</li>
      {{else}}
        <li>No collection items found.</li>
      {{end}}
    </ul>
  </div>
{{end}}
