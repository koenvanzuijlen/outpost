{{define "content"}}
    <h1>Wishlist</h1>
    <a href="/">Back to home</a>    
    <ul>
        {{range .Games}}
            <li><a href="/games/{{.Game.IgdbID}}">{{.Game.Title}}</a>{{if .Game.ReleasedAt}} ({{.Game.ReleasedAt.Year}}){{end}}</li>
        {{else}}
            <li>Your wishlist is empty.</li>
        {{end}}
    </ul>
{{end}}
